# Builds the site with Vite and publishes it to GitHub Pages.
#
# Runs on every push to main, or by hand from the Actions tab.
# Requires Settings → Pages → Source set to "GitHub Actions"; while Pages still
# deploys straight from a branch, this workflow's output is never served.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once. A newer push waits for the one in flight rather
# than cancelling it, so a half-finished deployment is never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `ci` installs exactly what package-lock.json pins, and fails if the
      # lockfile and package.json disagree, instead of quietly resolving anew.
      - run: npm ci

      # Type-checks first (tsc -b), so a type error fails the deploy rather
      # than shipping.
      - run: npm run build

      # public/ is copied into dist/ by Vite, which is how CNAME reaches the
      # published site and keeps mahmoud-abia.com attached.
      - name: Check the custom domain made it into the build
        run: test "$(cat dist/CNAME)" = "mahmoud-abia.com"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
